name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - develop-engine-snapshot

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out engine submodule
        run: git submodule update --init engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: yarn dist-test:mac

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: yarn dist-test:win

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: daisy-pipeline-mac
          path: dist/*.pkg

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: daisy-pipeline-win
          path: dist/*.exe

  publish-snapshot:
    needs: build
    if: github.ref == 'refs/heads/develop-engine-snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: daisy-pipeline-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: daisy-pipeline-win
          path: artifacts/win

      - name: Create Snapshot release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view snapshot --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create snapshot \
              --repo ${{ github.repository }} \
              --draft \
              --title "Snapshot" \
              --notes "Latest snapshot build from engine develop."

      - name: Replace Snapshot release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view snapshot --repo ${{ github.repository }} --json assets \
            --jq '.assets[].name' | while read name; do
              gh release delete-asset snapshot "$name" --repo ${{ github.repository }} --yes
            done
          gh release upload snapshot artifacts/mac/*.pkg artifacts/win/*.exe \
            --repo ${{ github.repository }}
