name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - develop-engine-snapshot

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out engine submodule
        run: git submodule update --init engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 8

      - name: Install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install make

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: yarn dist-debug:mac

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: yarn dist-debug:win
      
      - name: Store maven.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "maven-${{matrix.os}}.log"
          path: engine/maven.log
      
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: daisy-pipeline-mac
          path: dist/*.pkg

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: daisy-pipeline-win
          path: dist/*.exe

  publish-snapshot:
    needs: build
    if: github.ref == 'refs/heads/develop-engine-snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: daisy-pipeline-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: daisy-pipeline-win
          path: artifacts/win

      - name: Build Snapshot release notes
        id: snapshot-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="$RUNNER_TEMP/snapshot-release-notes.md"
          MILESTONES="$RUNNER_TEMP/open-milestones.json"
          ISSUES="$RUNNER_TEMP/ready-for-testing-issues.json"

          gh api --paginate "repos/$REPO/milestones?state=open&per_page=100" > "$MILESTONES"

          MILESTONE_TITLE="$(jq -sr '
            add
            | sort_by((.due_on // "9999-12-31T23:59:59Z"), .number)
            | .[0].title // ""
          ' "$MILESTONES")"
          MILESTONE_URL="$(jq -sr '
            add
            | sort_by((.due_on // "9999-12-31T23:59:59Z"), .number)
            | .[0].html_url // ""
          ' "$MILESTONES")"
          MILESTONE_SLUG="$(printf '%s' "$MILESTONE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$MILESTONE_SLUG" ]; then
            MILESTONE_SLUG="no-milestone"
          fi

          {
            echo "Latest snapshot builds from engine develop and pipeline-ui develop branches."
            echo

            if [ -n "$MILESTONE_TITLE" ]; then
              echo "Ready for testing in current milestone: [$MILESTONE_TITLE]($MILESTONE_URL)"
              echo

              gh issue list \
                --repo "$REPO" \
                --state open \
                --label "ready-for-testing" \
                --milestone "$MILESTONE_TITLE" \
                --limit 1000 \
                --json number,title,url \
                > "$ISSUES"

              if jq -e 'length > 0' "$ISSUES" > /dev/null; then
                jq -r 'sort_by(.number)[] | "- [#\(.number) \(.title)](\(.url))"' "$ISSUES"
              else
                echo "_No open ready-for-testing issues for this milestone._"
              fi
            else
              echo "_No open milestone found._"
            fi
          } > "$NOTES"

          echo "milestone_title=${MILESTONE_TITLE:-no milestone}" >> "$GITHUB_OUTPUT"
          echo "milestone_slug=$MILESTONE_SLUG" >> "$GITHUB_OUTPUT"
          cat "$NOTES"

      - name: Create or update Snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$RUNNER_TEMP/snapshot-release-notes.md"

          if gh release view ci-snapshot --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release edit ci-snapshot \
              --repo ${{ github.repository }} \
              --draft \
              --latest=false \
              --title "Development Snapshot" \
              --notes-file "$NOTES"
          else
            gh release create ci-snapshot \
              --repo ${{ github.repository }} \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "Development Snapshot" \
              --notes-file "$NOTES"
          fi

      - name: Replace Development Snapshot release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-snapshot --repo ${{ github.repository }} --json assets \
            --jq '.assets[].name' | while read name; do
              gh release delete-asset ci-snapshot "$name" --repo ${{ github.repository }} --yes
            done
          gh release upload ci-snapshot artifacts/mac/*.pkg artifacts/win/*.exe \
            --repo ${{ github.repository }}

      - name: Create Testing Snapshot release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[testing-snapshot]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE_TITLE: ${{ steps.snapshot-notes.outputs.milestone_title }}
          MILESTONE_SLUG: ${{ steps.snapshot-notes.outputs.milestone_slug }}
        run: |
          NOTES="$RUNNER_TEMP/snapshot-release-notes.md"
          PREFIX="testing-snapshot-${MILESTONE_SLUG}-"
          NEXT_INDEX="$(gh release list \
            --repo "$REPO" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' \
            | awk -v prefix="$PREFIX" '
                index($0, prefix) == 1 {
                  n = substr($0, length(prefix) + 1)
                  if (n ~ /^[0-9]+$/) {
                    index_number = n + 0
                    if (index_number > max) {
                      max = index_number
                    }
                  }
                }
                END { print max + 1 }
              ')"
          TAG="${PREFIX}${NEXT_INDEX}"
          TITLE="testing-snapshot ${MILESTONE_TITLE}-${NEXT_INDEX}"

          gh release create "$TAG" artifacts/mac/*.pkg artifacts/win/*.exe \
            --repo "$REPO" \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES"
