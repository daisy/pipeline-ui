name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters are globs, not regular expressions.
      - '[0-9]*.[0-9]*.[0-9]*'
      - '![0-9]*.[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*-beta*'
      - '[0-9]*.[0-9]*-beta*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta*'
      - 'v[0-9]*.[0-9]*-beta*'

env:
  GH_TOKEN: ${{ secrets.GH_PIPELINE_TOKEN }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
  APPLE_ID_TEAM: ${{ secrets.APPLE_ID_TEAM }}
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out engine submodule
        run: git submodule update --init engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Import installer signing certificate (macOS)
        if: runner.os == 'macOS'
        run: |
          CERT_PATH=$RUNNER_TEMP/installer.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo -n "$INSTALLER_CERT_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "${{ github.run_id }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ github.run_id }}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
        env:
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}

      - name: Build and release (macOS)
        if: runner.os == 'macOS'
        run: yarn release:mac

      - name: Sign installer (macOS)
        if: runner.os == 'macOS'
        run: bash sign-installer-mac.sh dist/*.pkg
        env:
          DEV_ID_INSTALLER: ${{ secrets.DEV_ID_INSTALLER }}

      - name: Re-upload signed installers to release (macOS)
        if: runner.os == 'macOS'
        run: gh release upload ${{ github.ref_name }} dist/*.pkg --clobber

      - name: Build experimental debug installers (macOS)
        if: runner.os == 'macOS'
        run: yarn release-debug:mac

      - name: Sign experimental debug installers (macOS)
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          files=(dist/*snapshot*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No debug installers found"
            exit 1
          fi
          bash sign-installer-mac.sh "${files[@]}"
        env:
          DEV_ID_INSTALLER: ${{ secrets.DEV_ID_INSTALLER }}

      - name: Upload experimental debug installers to release (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_DIR="$RUNNER_TEMP/experimental-assets"
          mkdir -p "$ASSET_DIR"
          shopt -s nullglob
          files=(dist/*snapshot*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No debug installers found"
            exit 1
          fi
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            platform="mac"
            if [[ "$name" == *arm64* ]]; then
              platform="mac-arm64"
            elif [[ "$name" == *x64* ]]; then
              platform="mac-x64"
            fi
            cp "$file" "$ASSET_DIR/daisy-pipeline-${VERSION}-experimental-${platform}.pkg"
          done
          gh release upload "${GITHUB_REF_NAME}" "$ASSET_DIR"/* --clobber

      - name: Clean up keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          else
            echo "Signing keychain not found; skipping cleanup."
          fi

      - name: Build and release (Windows)
        if: runner.os == 'Windows'
        run: yarn release:win

      - name: Build experimental debug installer (Windows)
        if: runner.os == 'Windows'
        run: yarn release-debug:win

      - name: Upload experimental debug installer to release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_DIR="$RUNNER_TEMP/experimental-assets"
          mkdir -p "$ASSET_DIR"
          shopt -s nullglob
          files=(dist/*snapshot*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No debug installer found"
            exit 1
          fi
          for file in "${files[@]}"; do
            cp "$file" "$ASSET_DIR/daisy-pipeline-${VERSION}-experimental-win.exe"
          done
          gh release upload "${GITHUB_REF_NAME}" "$ASSET_DIR"/* --clobber
