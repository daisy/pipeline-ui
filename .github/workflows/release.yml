name: Release

run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to release, for example 1.12.0'
        required: true
        type: string
  push:
    tags:
      # GitHub Actions tag filters are globs, not regular expressions.
      - '[0-9]*.[0-9]*.[0-9]*'
      - '![0-9]*.[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*-beta*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta*'

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PIPELINE_TOKEN }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
  APPLE_ID_TEAM: ${{ secrets.APPLE_ID_TEAM }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Release tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" > /dev/null; then
            echo "::error::Release tag '${RELEASE_TAG}' was not found."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must be a final or beta version tag, such as 1.12.0 or 1.12.0-beta.1."
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${APP_VERSION}'."
            exit 1
          fi
          if [ "$RELEASE_TAG" = "$RELEASE_VERSION" ]; then
            COUNTERPART_TAG="v${RELEASE_VERSION}"
          else
            COUNTERPART_TAG="$RELEASE_VERSION"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "COUNTERPART_TAG=$COUNTERPART_TAG" >> "$GITHUB_ENV"

      - name: Check out engine submodule
        run: git submodule update --init engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 8

      - name: Install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Ensure draft GitHub release exists
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$COUNTERPART_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release '$COUNTERPART_TAG' also exists. Delete or rename it before releasing '$RELEASE_TAG' to avoid v/non-v asset ambiguity."
            exit 1
          fi

          RELEASE_IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "Draft release $RELEASE_TAG already exists."
          elif [ "$RELEASE_IS_DRAFT" = "false" ]; then
            echo "::error::Release '$RELEASE_TAG' already exists and is not a draft."
            exit 1
          elif gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG"; then
            echo "Created draft release $RELEASE_TAG."
          else
            RELEASE_IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$RELEASE_IS_DRAFT" != "true" ]; then
              echo "::error::Release '$RELEASE_TAG' exists but is not a draft."
              exit 1
            fi
            echo "Draft release $RELEASE_TAG already exists."
          fi

      - name: Remove auto-published release metadata
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | while IFS= read -r name; do
              case "$name" in
                *.blockmap|latest*.yml|builder-debug.yml|*snapshot*)
                  echo "Deleting generated release clutter asset $name"
                  gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
                  ;;
              esac
            done

      - name: Import macOS signing certificates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$GITHUB_RUN_ID"
          APP_CERT_PATH="$RUNNER_TEMP/app-signing.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer.p12"

          write_cert() {
            local source="$1"
            local destination="$2"

            if [[ "$source" == http://* || "$source" == https://* ]]; then
              curl -fsSL "$source" -o "$destination"
            elif [[ "$source" == file://* ]]; then
              cp "${source#file://}" "$destination"
            elif [[ "$source" == data:*base64,* ]]; then
              printf '%s' "${source#*,}" | base64 --decode -o "$destination"
            else
              printf '%s' "$source" | base64 --decode -o "$destination"
            fi
          }

          : "${CSC_LINK:?CSC_LINK secret is required.}"
          : "${CSC_KEY_PASSWORD:?CSC_KEY_PASSWORD secret is required.}"
          : "${INSTALLER_CERT_P12:?INSTALLER_CERT_P12 secret is required.}"
          : "${INSTALLER_CERT_PASSWORD:?INSTALLER_CERT_PASSWORD secret is required.}"

          write_cert "$CSC_LINK" "$APP_CERT_PATH"
          write_cert "$INSTALLER_CERT_P12" "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && USER_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.+)"$/\1/')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application: US Fund for DAISY (SAMG8AWD69)'; then
            echo "::error::Developer ID Application signing identity was not imported."
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}

      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        run: yarn dist-signed:mac

      - name: Sign installer (macOS)
        if: runner.os == 'macOS'
        run: bash sign-installer-mac.sh dist/*.pkg
        env:
          DEV_ID_INSTALLER: ${{ secrets.DEV_ID_INSTALLER }}

      - name: Upload signed installers to release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No macOS installers found"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          for file in "${files[@]}"; do
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Build experimental release installers (macOS)
        if: runner.os == 'macOS'
        run: |
          yarn clean
          yarn release-experimental:mac

      - name: Sign experimental release installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*experimental*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No experimental release installers found"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          bash sign-installer-mac.sh "${files[@]}"
        env:
          DEV_ID_INSTALLER: ${{ secrets.DEV_ID_INSTALLER }}

      - name: Upload experimental release installers to release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/experimental-assets"
          mkdir -p "$ASSET_DIR"
          shopt -s nullglob
          files=(dist/*experimental*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No experimental release installers found"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            platform="mac"
            if [[ "$name" == *arm64* ]]; then
              platform="mac-arm64"
            elif [[ "$name" == *x64* ]]; then
              platform="mac-x64"
            fi
            asset="$ASSET_DIR/daisy-pipeline-${RELEASE_VERSION}-experimental-${platform}.pkg"
            cp "$file" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Clean up keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            if ! security delete-keychain "$KEYCHAIN_PATH"; then
              echo "::warning::Failed to delete signing keychain; continuing."
            fi
          else
            echo "Signing keychain not found; skipping cleanup."
          fi

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: yarn dist-signed:win

      - name: Upload installer to release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.exe)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected one Windows installer, found ${#files[@]}"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[0]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build experimental release installer (Windows)
        if: runner.os == 'Windows'
        run: |
          yarn clean
          yarn release-experimental:win

      - name: Upload experimental release installer to release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/experimental-assets"
          mkdir -p "$ASSET_DIR"
          shopt -s nullglob
          files=(dist/*experimental*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No experimental release installer found"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected one experimental release Windows installer, found ${#files[@]}"
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          for file in "${files[@]}"; do
            asset="$ASSET_DIR/daisy-pipeline-${RELEASE_VERSION}-experimental-win.exe"
            cp "$file" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Store maven.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "release-maven-${{ matrix.os }}.log"
          path: engine/maven.log
          if-no-files-found: warn
