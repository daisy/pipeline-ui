name: Snapshot

# Creates/updates the 'develop-engine-snapshot' branch in pipeline-ui
# with the engine submodule pointing at the given engine SHA.
# A push to that branch then triggers the Package workflow.

on:
  workflow_dispatch:
    inputs:
      engine_sha:
        description: 'Engine commit SHA (defaults to HEAD of engine develop branch)'
        required: false
      create_testing_snapshot:
        description: 'Also create a numbered testing snapshot release after packaging'
        required: false
        default: false
        type: boolean

jobs:
  update-snapshot-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GH_PIPELINE_TOKEN can push to repository
        env:
          GH_PIPELINE_TOKEN: ${{ secrets.GH_PIPELINE_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_PIPELINE_TOKEN" ]; then
            echo "::error::GH_PIPELINE_TOKEN is not available to this workflow"
            exit 1
          fi

          RESPONSE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE" -w "%{http_code}" \
            -H "Authorization: Bearer $GH_PIPELINE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::GH_PIPELINE_TOKEN cannot access $GH_REPOSITORY (GitHub API status $STATUS)"
            exit 1
          fi

          CAN_PUSH="$(jq -r '.permissions.push // false' "$RESPONSE")"
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::GH_PIPELINE_TOKEN can read $GH_REPOSITORY but does not have push permission"
            exit 1
          fi

      - name: Check out pipeline-ui develop
        uses: actions/checkout@v4
        with:
          ref: refs/heads/develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout
        run: git log --oneline -3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize engine submodule
        run: git submodule update --init engine

      - name: Resolve engine SHA
        id: engine
        run: |
          SHA="${{ github.event.inputs.engine_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git -C engine ls-remote origin refs/heads/develop | cut -f1)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Point engine submodule at resolved SHA
        run: |
          cd engine
          git fetch --depth 1 origin "${{ steps.engine.outputs.sha }}"
          git checkout FETCH_HEAD
          cd ..
          git add engine

      - name: Create or update develop-engine-snapshot branch
        env:
          GH_PIPELINE_TOKEN: ${{ secrets.GH_PIPELINE_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          SHA="${{ steps.engine.outputs.sha }}"
          TESTING_SNAPSHOT="${{ github.event.inputs.create_testing_snapshot }}"
          COMMIT_MESSAGE="ci: trigger package build for engine ${SHA:0:7}"
          if [ "$TESTING_SNAPSHOT" = "true" ]; then
            COMMIT_MESSAGE="$COMMIT_MESSAGE [testing-snapshot]"
          fi
          git remote set-url origin "https://x-access-token:${GH_PIPELINE_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git diff --cached --quiet || git commit -m "chore: update engine submodule to ${SHA:0:7} (engine develop)"
          git commit --allow-empty -m "$COMMIT_MESSAGE"
          git push origin HEAD:refs/heads/develop-engine-snapshot --force
